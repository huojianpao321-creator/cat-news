        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header {
            width: 100%;
            max-height: 400px;
            overflow: hidden;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
        }
        .header img {
            width: 100%;
            max-width: 1200px;
            height: auto;
            display: block;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .news-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #f3ba2f;
        }
        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .news-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }
        .news-date {
            font-size: 0.9em;
            color: #888;
        }
        @media (max-width: 600px) {
            .news-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .news-date {
                font-size: 0.85em;
            }
        }
    </style>
</head>
